name: Render D2 Diagrams

on:
  push:
    paths:
      - 'docs/diagrams/*.d2'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install D2
        run: |
          curl -fsSL https://d2lang.com/install.sh | sh -s --

      - name: Render D2 Files to SVG
        run: |
          mkdir -p docs/diagrams/rendered
          for file in docs/diagrams/*.d2; do
            filename=$(basename "$file" .d2)
            d2 --layout=dagre "$file" "docs/diagrams/rendered/$filename.svg"
          done

      - name: Commit rendered SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: renderizar diagramas D2 a SVG automáticamente"
          file_pattern: 'docs/diagrams/rendered/*.svg'
