name: OpenReader Release

# Push a main: rama release/vX.Y.Z + tag vX.Y.Z + GitHub Release.
# La versión sale solo de app/build.gradle.kts. Si el tag ya existe
# o versionCode no sube, el job falla y no publica nada.
on:
  push:
    branches: [ "main" ]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Comprobar versión
        id: ver
        run: |
          set -euo pipefail
          NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)
          if [ -z "$NAME" ] || [ -z "$CODE" ]; then
            echo "No se pudo leer versionName o versionCode."
            exit 1
          fi
          if ! printf '%s' "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "versionName debe ser MAJOR.MINOR.PATCH. Actual: $NAME"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$NAME" >/dev/null; then
            echo "El tag v$NAME ya existe. Sube versionName y versionCode en app/build.gradle.kts antes de integrar a main."
            exit 1
          fi
          PREV=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)
          if [ -n "$PREV" ]; then
            PREV_CODE=$(git show "$PREV:app/build.gradle.kts" | sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p')
            if [ -z "$PREV_CODE" ] || [ "$CODE" -le "$PREV_CODE" ]; then
              echo "versionCode $CODE tiene que ser mayor que $PREV_CODE ($PREV)."
              exit 1
            fi
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Publicará v$NAME (versionCode $CODE)."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Test and build release APK
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Crear rama release y tag
        run: |
          set -euo pipefail
          NAME="${{ steps.ver.outputs.name }}"
          CODE="${{ steps.ver.outputs.code }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$NAME" -m "OpenReader v$NAME (versionCode $CODE)"
          git push origin "HEAD:refs/heads/release/v$NAME"
          git push origin "v$NAME"

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME="${{ steps.ver.outputs.name }}"
          CODE="${{ steps.ver.outputs.code }}"
          gh release create "v$NAME" \
            --target "release/v$NAME" \
            --title "OpenReader v$NAME" \
            --notes "versionCode $CODE. El APK de release no está firmado para Play; la versión canónica es versionName/versionCode en app/build.gradle.kts." \
            app/build/outputs/apk/release/*.apk
