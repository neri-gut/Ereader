spec_version: "1.0"
project: OpenReader
module: core_and_storage

requirements:
  - id: REQ-CORE-01
    title: "Identificación unívoca de documentos"
    description: "Generar un hash criptográfico SHA-256 del contenido del PDF al abrirlo."
    rules:
      - "No depender de la ruta del archivo ni del URI del sistema de archivos."
      - "Permitir reubicar el archivo (mover de carpeta local a USB) sin perder el historial."
    outputs:
      file_hash: "String (SHA-256 de los primeros 8MB o del archivo completo si es menor)"

  - id: REQ-CORE-02
    title: "Acceso al almacenamiento local y extendido"
    description: "Abrir archivos PDF desde el almacenamiento interno, memoria USB (OTG) o carpetas compartidas."
    actions:
      - "Utilizar Storage Access Framework (SAF) con Intent.ACTION_OPEN_DOCUMENT e Intent.ACTION_OPEN_DOCUMENT_TREE."
      - "Mantener permisos persistentes (takePersistableUriPermission) para accesos posteriores."

  - id: REQ-CORE-03
    title: "Control de progreso de lectura granular"
    description: "Guardar el estado de lectura exacto de cada documento en base de datos local."
    schema:
      table: "reading_progress"
      fields:
        - "file_hash: String (PK)"
        - "file_name: String"
        - "paragraph_index: Int"
        - "char_offset: Int"
        - "total_paragraphs: Int"
        - "last_read_timestamp: Long"
    constraints:
      - "Actualizar en Room Database de forma asíncrona tras cada cambio de párrafo o pausa de TTS."
