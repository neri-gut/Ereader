spec_version: "1.0"
project: OpenReader
module: tts_neural_engine

requirements:
  - id: REQ-TTS-01
    title: "Selección Dinámica de Motor de Voz"
    description: "Permitir conmutar entre el motor TTS nativo del sistema operativo y el motor neuronal local Sherpa-ONNX/Piper."
    options:
      - "SystemTTS: Android TextToSpeech API."
      - "NeuralONNX: Sherpa-ONNX runtime con voz Piper VITS local."

  - id: REQ-TTS-02
    title: "Cola de Pre-Procesamiento N+1"
    description: "Garantizar la reproducción continua sin pausas entre párrafos mediante un buffer de precarga."
    behavior:
      - "Párrafo N en reproducción active -> Enviar buffer PCM N a AudioTrack."
      - "Párrafo N+1 -> Generar síntesis PCM asíncrona mediante Coroutine Channel de capacidad = 2."
      - "Al terminar N -> Iniciar inmediatamente N+1 y disparar la síntesis de N+2."

  - id: REQ-TTS-03
    title: "Control y Resaltado Sincronizado"
    description: "Sincronizar la lectura de audio con la interfaz visual."
    controls:
      - "Controles: Play, Pausa, Siguiente Párrafo, Párrafo Anterior."
      - "Ajuste de velocidad: 0.5x a 3.0x."
      - "Resaltado: Notificar el rango de caracteres activos (startOffset, endOffset) para aplicar estilo de fondo al texto renderizado."
