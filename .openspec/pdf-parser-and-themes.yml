spec_version: "1.0"
project: OpenReader
module: pdf_parser_and_themes

requirements:
  - id: REQ-PDF-01
    title: "Extracción y normalización de texto plano"
    description: "Procesar el PDF para transformarlo en un flujo continuo de párrafos limpios."
    rules:
      - "Eliminar marcas de agua, encabezados y pies de página repetitivos."
      - "Descartar completamente elementos gráficos e imágenes embebidas."
      - "Unir saltos de línea dentro de un mismo párrafo (de-hyphenation)."
      - "Estructurar el documento como List<ParagraphData> donde cada párrafo tiene un id consecutivo."

  - id: REQ-PDF-02
    title: "Vista PDF Nativa de Verificación (Opcional)"
    description: "Proporcionar un visor de PDF estructurado por páginas para comprobación visual rápida del documento original."
    components:
      - "PdfRenderer nativo o controlador de vista previa simple de páginas."
      - "Acceso mediante un botón flotante/conmutador en la barra superior."

  - id: REQ-PDF-03
    title: "Motor de Temas y Tipografía Ajustable"
    description: "Permitir la personalización completa del entorno de lectura."
    configurations:
      themes:
        - name: "Claro"
          bg: "#FFFFFF"
          text: "#121212"
        - name: "Sepia"
          bg: "#F4ECD8"
          text: "#5F4B32"
        - name: "Noche"
          bg: "#121212"
          text: "#E0E0E0"
      typography:
        - "Fuentes: Serif, Sans-Serif, Monospace, OpenDyslexic (incluida en assets)."
        - "Tamaño de fuente: 12sp a 32sp."
        - "Interlineado: 1.0x a 2.0x."
        - "Ancho máximo del contenedor de texto: 42rem a 48rem en pantallas grandes (MatePad 12 X) y 100% en teléfonos (POCO F7)."
